# Example Secret layout for JAR + JKS (LLM-S06). Do NOT commit real material.
# Create with:
#   kubectl -n jhub create secret generic nbi-llm-auth \
#     --from-file=token-tool.jar=./token-tool.jar \
#     --from-file=keystore.jks=./keystore.jks \
#     --from-file=truststore.jks=./aitruststore.jks \
#     --from-literal=KEYSTORE_PASSWORD='***' \
#     --from-literal=TRUSTSTORE_PASSWORD='***'
apiVersion: v1
kind: Secret
metadata:
  name: nbi-llm-auth
  namespace: jhub
type: Opaque
stringData:
  KEYSTORE_PASSWORD: 'changeit'
  TRUSTSTORE_PASSWORD: 'changeit'
  OIDC_TOKEN_URL: 'https://idp.example.com/.../token'
  OIDC_CLIENT_CODE: 'code-example-sys'
  OIDC_DOMAIN: 'mydomain'
# binaryData would hold jar/jks when using sealed-secrets / ESO — prefer
# volume projection from CSI instead of embedding in YAML.
---
